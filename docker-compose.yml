version: '3.8'

services:
  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - anandwan-network

  # Backend Spring Boot Application
  backend:
    build:
      context: ./payment-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db.wjtsegdauldnfvdelzas.supabase.co:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=I5chGeeHcAvYgWbF
      - RAZORPAY_KEY_ID=rzp_test_SPCKnvExBKyloE
      - RAZORPAY_KEY_SECRET=cM6Cque9qby5CboDzFfW8LvN
    depends_on:
      - postgres
    networks:
      - anandwan-network

  # PostgreSQL Database (for local development - optional)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=anandwan_payment
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anandwan-network

volumes:
  postgres_data:

networks:
  anandwan-network:
    driver: bridge